  /mobile-v2/izin/insert:
    post:
      tags: [Absensi - Izin & Sakit]
      summary: Insert Pengajuan Izin/Cuti
      description: |
        Mengajukan izin, sakit, atau cuti.
        - **Validasi**: Reason, Keterangan, Tanggal Mulai, Tanggal Selesai, dan File Lampiran wajib ada dengan pesan berbahasa Indonesia yang jelas.
        - Jika **reason = CUTI** atau **is_potong_cuti = 1**, sistem memvalidasi kuota cuti tahunan pegawai via `sp_mobile_cek_kuota_cuti`.
        - Jika **reason = IZIN**, sistem memvalidasi kuota izin pegawai via `sp_cek_kuota_izin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, description, start_date, end_date, filename]
              properties:
                reason:
                  type: string
                  enum: [IZIN, SAKIT, CUTI]
                  example: CUTI
                description:
                  type: string
                  example: Keperluan keluarga
                start_date:
                  type: string
                  example: 04 November 2026
                  description: Format tanggal Indonesia (dd MMMM YYYY) atau Y-m-d
                end_date:
                  type: string
                  example: 06 November 2026
                  description: Format tanggal Indonesia (dd MMMM YYYY) atau Y-m-d
                filename:
                  type: string
                  example: surat_izin_001.pdf
                alasan_id:
                  type: integer
                  nullable: true
                  example: 1
                  description: ID alasan / jenis cuti
                is_potong_cuti:
                  type: integer
                  nullable: true
                  example: 1
                  description: Set 1 jika memotong kuota cuti
          multipart/form-data:
            schema:
              type: object
              required: [reason, description, start_date, end_date, filename]
              properties:
                reason:
                  type: string
                  enum: [IZIN, SAKIT, CUTI]
                  example: CUTI
                description:
                  type: string
                  example: Keperluan keluarga
                start_date:
                  type: string
                  example: 04 November 2026
                  description: Format tanggal Indonesia (dd MMMM YYYY) atau Y-m-d
                end_date:
                  type: string
                  example: 06 November 2026
                  description: Format tanggal Indonesia (dd MMMM YYYY) atau Y-m-d
                filename:
                  type: string
                  example: surat_izin_001.pdf
                alasan_id:
                  type: integer
                  nullable: true
                  example: 1
                  description: ID alasan / jenis cuti
                is_potong_cuti:
                  type: integer
                  nullable: true
                  example: 1
                  description: Set 1 jika memotong kuota cuti
      responses:
        '200':
          description: Pengajuan berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Pengajuan gagal (kuota tidak cukup / diluar H-7 / tanggal tidak valid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jumlah_cuti:
                            type: integer
                            example: 3
                          sisa_kuota:
                            type: integer
                            example: 2
                          kuota_awal:
                            type: integer
                            example: 12

