              type: object
              required: [old_password, new_password, confirm_new_password]
              properties:
                old_password:
                  type: string
                  example: '12345'
                new_password:
                  type: string
                  example: '12345678'
                confirm_new_password:
                  type: string
                  example: '12345678'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Gagal ubah password (password lama salah / konfirmasi tidak cocok)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # VERIFIKASI ABSEN LUAR
  # ─────────────────────────────────────────
  /mobile-v2/verifikasi-absen-luar/list:
    get:
      tags: [Verifikasi Absen Luar]
      summary: List Data Absen Luar
      description: Menampilkan daftar absen di luar kantor yang perlu diverifikasi
      responses:
        '200':
          description: Data absen luar
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ─────────────────────────────────────────
  # VERIFIKASI ABSEN PENGAJUAN
  # ─────────────────────────────────────────
  /mobile-v2/verifikasi-absen-pengajuan/list:
    get:
      tags: [Verifikasi Absen Pengajuan]
      summary: List Pengajuan Bawahan
      description: |
        Menampilkan daftar pengajuan izin/sakit/cuti dari bawahan yang perlu diverifikasi.

        Data difilter otomatis berdasarkan level dan scope subdepartemen atasan yang login.
        Hanya menampilkan pegawai dengan level occupation **lebih besar** dari si atasan.

        Hasil dibagi menjadi dua grup:
        - `done` — pengajuan yang sudah diverifikasi semua level
        - `undone` — pengajuan yang belum/sedang proses verifikasi
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            example: '202605'
          description: Periode dalam format YYYYMM
        - name: search_nama
          in: query
          required: false
          schema:
            type: string
            example: Tes
          description: Filter nama pegawai (partial match)
        - name: search_nup
          in: query
          required: false
          schema:
            type: string
            example: '0720251286'
          description: Filter NUP pegawai (exact match)
        - name: alasan_id
          in: query
          required: false
          schema:
            type: integer
            example: 2
          description: Filter berdasarkan ID alasan pengajuan
      responses:
        '200':
          description: Data pengajuan bawahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  done:
                    type: array
                    description: Pengajuan yang sudah diverifikasi semua level
                    items:
                      $ref: '#/components/schemas/PengajuanItem'
                  undone:
                    type: array
                    description: Pengajuan yang belum/sedang proses verifikasi
                    items:
                      $ref: '#/components/schemas/PengajuanItem'

  /mobile-v2/verifikasi-absen-pengajuan/verify:
    post:
      tags: [Verifikasi Absen Pengajuan]
      summary: Verifikasi Pengajuan
      description: |
        Menyetujui pengajuan izin/sakit/cuti bawahan.

        Kolom approve yang diupdate ditentukan otomatis dari level occupation atasan yang login:
        - **Level 2 (Manajer)** → `approve_2 = 1`
        - **Level 3 (Asmen)** → `approve_3 = 1`

        Endpoint akan menolak jika pengajuan sudah diverifikasi di level yang sama sebelumnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  example: 1065
                  description: ID pengajuan absen
      responses:
        '200':
          description: Pengajuan berhasil diverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Gagal verifikasi (sudah diverifikasi sebelumnya / data tidak ditemukan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Level jabatan tidak memiliki akses verifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pegawai atau data pengajuan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mobile-v2/verifikasi-absen-pengajuan/unverify:
    post:
      tags: [Verifikasi Absen Pengajuan]
      summary: Batalkan Verifikasi Pengajuan
      description: |
        Membatalkan verifikasi yang sudah diberikan (reset approve ke NULL).

        Kolom yang direset ditentukan otomatis dari level occupation atasan yang login:
        - **Level 2 (Manajer)** → `approve_2 = NULL`, `approve_2_dt = NULL`, `approve_2_user = NULL`
        - **Level 3 (Asmen)** → `approve_3 = NULL`, `approve_3_dt = NULL`, `approve_3_user = NULL`

        Endpoint akan menolak jika pengajuan belum pernah diverifikasi di level yang sama.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  example: 1065
                  description: ID pengajuan absen
      responses:
        '200':
          description: Verifikasi berhasil dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Gagal membatalkan (belum diverifikasi / data tidak ditemukan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Level jabatan tidak memiliki akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pegawai atau data pengajuan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mobile-v2/verifikasi-absen-pengajuan/reject:
    post:
      tags: [Verifikasi Absen Pengajuan]
      summary: Tolak Pengajuan
      description: |
        Menolak pengajuan izin/sakit/cuti bawahan disertai catatan alasan penolakan.

        Kolom approve yang diupdate ditentukan otomatis dari level occupation atasan yang login:
        - **Level 2 (Manajer)** → `approve_2 = 0`, `approve_2_dt`, `approve_2_user`, `catatan_2` diisi
        - **Level 3 (Asmen)** → `approve_3 = 0`, `approve_3_dt`, `approve_3_user`, `catatan_3` diisi

        Endpoint akan menolak jika pengajuan sudah ditolak di level yang sama sebelumnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, catatan]
              properties:
                id:
                  type: integer
                  example: 1065
                  description: ID pengajuan absen
                catatan:
                  type: string
                  example: Ga valid
                  description: Alasan penolakan pengajuan
      responses:
        '200':
          description: Pengajuan berhasil ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Gagal menolak (sudah ditolak sebelumnya / data tidak ditemukan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Level jabatan tidak memiliki akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pegawai atau data pengajuan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # RFC — ENDPOINT BARU
  # ─────────────────────────────────────────
  /mobile-v2/absen-lembur/pre-check:
    post:
      tags: [RFC]
      summary: Pre Check Sebelum Absen Lembur
      description: |
        Validasi ringan sebelum membuka menu absen lembur.
        Mengecek apakah pegawai sudah absen pulang hari ini atau belum.

        Cek dilakukan ke:
        1. `absen_trans_shift` (karyawan shift) — kolom `outpresent_jam`
        2. `absen_trans` (karyawan non-shift) — kolom `outpresent`

        Nilai `NULL` dan `00:00:00` sama-sama dianggap belum absen pulang.

        **Selalu mengembalikan HTTP 200** — mobile tinggal baca `boleh_lembur`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [vdate]
              properties:
                vdate:
                  type: string
                  format: date
                  example: '2026-04-28'
                  description: Tanggal yang dicek (format Y-m-d)
      responses:
        '200':
          description: Status absen pulang pegawai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreCheckLemburResponse'

  # ─────────────────────────────────────────
  # ALOKASI JADWAL LEMBUR (FLUTTER MOBILE)
  # ─────────────────────────────────────────
  /mobile-v2/alokasi-lembur/user-context:
    get:
      tags: [Alokasi Lembur]
      summary: User Context & Multi-Peran (Definitif / Interim)
      description: |
        Mengambil identitas pegawai, hak akses jabatan definitif, serta daftar jabatan interim aktif (Plt / Pj).
        Digunakan oleh Header Flutter untuk menampilkan profil dan mengisi Dropdown Switcher Peran (Definitif vs Interim).
      parameters:
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
          description: "Kunci peran yang ingin diaktifkan (misal: 'definitif', 'interim_1')"
        - name: X-Role-Key
          in: header
          required: false
          schema:
            type: string
            example: 'definitif'
      responses:
        '200':
          description: Data context pengguna berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Alokasi Lembur]
      summary: User Context & Multi-Peran (POST Alternative)
      description: Alternatif POST untuk mengambil user context.
      parameters:
        - name: role_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Data context pengguna berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextResponse'

  /mobile-v2/alokasi-lembur/ref-department:
    get:
      tags: [Alokasi Lembur]
      summary: Referensi Bagian (Department)
      description: |
        Mengambil daftar Bagian yang dapat dipilih pada form pengajuan atau filter riwayat.
        Otomatis di-scope berdasarkan unit aktif (jika non-admin, terkunci ke Bagian unit aktifnya).
      parameters:
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pencarian nama atau kode bagian
      responses:
        '200':
          description: Daftar Bagian berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefDepartmentResponse'
        '401':
          description: Unauthorized
    post:
      tags: [Alokasi Lembur]
      summary: Referensi Bagian (POST Alternative)
      responses:
        '200':
          description: Daftar Bagian berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefDepartmentResponse'

  /mobile-v2/alokasi-lembur/ref-subdepartment:
    get:
      tags: [Alokasi Lembur]
      summary: Referensi Sub Bagian (Subdepartment)
      description: |
        Mengambil daftar Sub Bagian di bawah Bagian yang dipilih.
        - **Jika Manager Unit**: Dapat memilih semua Sub Bagian di bawah Bagian tersebut.
        - **Jika Non-Manager / Staf**: Terkunci ke Sub Bagian unitnya (kecuali Dept 33 Subdept 80 mencakup Subdept 132).
      parameters:
        - name: dept_id
          in: query
          required: false
          schema:
            type: integer
            example: 33
          description: ID Bagian induk
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pencarian nama/kode sub bagian
      responses:
        '200':
          description: Daftar Sub Bagian berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefSubDepartmentResponse'
        '401':
          description: Unauthorized
    post:
      tags: [Alokasi Lembur]
      summary: Referensi Sub Bagian (POST Alternative)
      responses:
        '200':
          description: Daftar Sub Bagian berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefSubDepartmentResponse'

  /mobile-v2/alokasi-lembur/ref-pegawai:
    get:
      tags: [Alokasi Lembur]
      summary: Referensi Pegawai Lembur (Bawahan Aktif)
      description: |
        Mengambil daftar pegawai bawahan aktif (tidak pensiun, level > 3) di unit Bagian/Sub Bagian yang dipilih.
        Digunakan oleh Flutter saat menambahkan baris pegawai lembur di form pengajuan.
      parameters:
        - name: dept_id
          in: query
          required: false
          schema:
            type: integer
            example: 33
        - name: subdept_id
          in: query
          required: false
          schema:
            type: integer
            example: 80
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pencarian nama atau NUP pegawai
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Daftar pegawai berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefPegawaiResponse'
        '401':
          description: Unauthorized
    post:
      tags: [Alokasi Lembur]
      summary: Referensi Pegawai Lembur (POST Alternative)
      responses:
        '200':
          description: Daftar pegawai berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefPegawaiResponse'

  /mobile-v2/alokasi-lembur/list:
    get:
      tags: [Alokasi Lembur]
      summary: Riwayat Alokasi Lembur (Cards)
      description: |
        Menampilkan daftar jadwal lembur dalam format Card untuk Tab Riwayat di Flutter.
        Mendukung filter tanggal, bagian, sub bagian, pencarian kata kunci, serta pagination.
      parameters:
        - name: dept_id
          in: query
          required: false
          schema:
            type: integer
            example: 33
        - name: subdept_id
          in: query
          required: false
          schema:
            type: integer
            example: 80
        - name: tanggal_from
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-11-01'
          description: Filter dari tanggal
        - name: tanggal_to
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-11-30'
          description: Filter sampai tanggal
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pencarian uraian pekerjaan atau nama bagian
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar riwayat lembur berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlokasiLemburListResponse'
        '401':
          description: Unauthorized
    post:
      tags: [Alokasi Lembur]
      summary: Riwayat Alokasi Lembur (POST Alternative)
      responses:
        '200':
          description: Daftar riwayat lembur berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlokasiLemburListResponse'

  /mobile-v2/alokasi-lembur/detail:
    get:
      tags: [Alokasi Lembur]
      summary: Detail Alokasi Lembur & Status Kehadiran
      description: |
        Mengambil detail satu jadwal lembur beserta daftar pegawai, jam rencana, jam realisasi,
        jam masuk & pulang aktual (dari `kepegawaian.absen_trans_lembur`), durasi kerja, dan status kehadiran (Hadir/Belum).
        Digunakan oleh Modal Detail Pegawai Lembur pada Layar 3 di Flutter mockup.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            example: 1
          description: ID Alokasi Lembur (spkl_id)
        - name: role_key
          in: query
          required: false
          schema:
            type: string
            example: 'definitif'
      responses:
        '200':
          description: Detail alokasi lembur berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlokasiLemburDetailResponse'
        '400':
          description: ID Alokasi Lembur tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tidak memiliki hak akses
        '404':
          description: Data Alokasi Lembur tidak ditemukan
    post:
      tags: [Alokasi Lembur]
      summary: Detail Alokasi Lembur (POST Alternative)
      responses:
        '200':
          description: Detail alokasi lembur berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlokasiLemburDetailResponse'

  /mobile-v2/alokasi-lembur/store:
    post:
      tags: [Alokasi Lembur]
      summary: Simpan / Update Alokasi Lembur
      description: |
        Menyimpan jadwal lembur baru atau memperbarui jadwal lembur yang sudah ada (Tab Pengajuan).
        - **Validasi**: Tanggal Masuk, Bagian, Keterangan, dan minimal 1 Pegawai wajib diisi.
        - **Validasi Bentrok Jadwal**: Memeriksa apakah pegawai sudah memiliki jadwal lembur yang bertabrakan pada rentang jam tersebut via `checkBentrokLembur`.
        - **Sinkronisasi Otomatis**: Secara otomatis membuat / mengupdate baris absensi lembur di `kepegawaian.absen_trans_lembur`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlokasiLemburStoreRequest'
      responses:
        '200':
          description: Jadwal lembur berhasil disimpan / diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Jadwal lembur baru berhasil disimpan!"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '403':
          description: Tidak memiliki hak akses pada Bagian / Sub Bagian yang dipilih
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal menyimpan (contoh bentrok jadwal lembur pegawai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mobile-v2/alokasi-lembur/delete:
    post:
      tags: [Alokasi Lembur]
      summary: Hapus Jadwal Lembur
      description: |
        Menghapus jadwal lembur dan rincian pegawai, serta melakukan soft-delete (`is_delete = 1`)
        pada tabel `kepegawaian.absen_trans_lembur` pegawai terkait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  example: 1
                  description: ID Alokasi Lembur yang akan dihapus
      responses:
        '200':
          description: Jadwal lembur berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Jadwal lembur berhasil dihapus."
        '400':
          description: ID Alokasi Lembur tidak valid
        '403':
          description: Tidak memiliki hak akses
        '404':
          description: Data Alokasi Lembur tidak ditemukan
    delete:
      tags: [Alokasi Lembur]
      summary: Hapus Jadwal Lembur (DELETE Alternative)
      responses:
        '200':
          description: Jadwal lembur berhasil dihapus

  /mobile-v2/alokasi-lembur/realisasi:
    post:
      tags: [Alokasi Lembur]
      summary: Simpan Realisasi Jam Lembur
      description: |
        Memperbarui kolom `realisasi_dari_jam`, `realisasi_sampai_jam`, dan `keterangan`
        pada tabel `kepegawaian.alokasi_lembur_detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail]
              properties:
                detail:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
                        example: 101
                        description: ID detail alokasi lembur
                      realisasi_dari_jam:
                        type: string
                        example: "08:00"
                      realisasi_sampai_jam:
                        type: string
                        example: "16:00"
                      keterangan:
                        type: string
                        nullable: true
                        example: "Selesai tepat waktu"
      responses:
        '200':
          description: Realisasi jam lembur berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Realisasi jam lembur berhasil disimpan"
        '422':
          description: Tidak ada data realisasi yang dikirim
