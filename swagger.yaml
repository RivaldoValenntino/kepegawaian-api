tags:
  - name: Auth
    description: Autentikasi pengguna
  - name: Alokasi Lembur
    description: |
      Manajemen Alokasi Jadwal Lembur Pegawai (Flutter Mobile).
      Mendukung multi-peran (Jabatan Definitif dan Interim / Plt / Pj),
      filtering bawahan aktif, validasi bentrok jadwal lembur, dan sinkronisasi otomatis ke absen_trans_lembur.
  - name: Absensi - Absen
    description: Absen masuk dan pulang harian
  - name: Absensi - Lembur
    description: Absen lembur pegawai
  - name: Absensi - Apel
    description: Absen apel pegawai
  - name: Absensi - Istirahat
    description: Absen istirahat pegawai
  - name: Absensi - Izin & Sakit
    description: Pengajuan izin dan sakit
  - name: Personalia - Saran Pegawai
    description: Saran dan keluhan dari pegawai
  - name: Personalia - Biodata & Berkas
    description: Biodata dan berkas dokumen pegawai
  - name: Personalia - Info Perusahaan
    description: Pengumuman dan informasi dari perusahaan
  - name: Pengaturan Akun
    description: Pengaturan akun pengguna
  - name: Verifikasi Absen Luar
    description: Verifikasi absen di luar kantor
  - name: Verifikasi Absen Pengajuan
    description: |
      Verifikasi pengajuan izin/sakit/cuti bawahan oleh atasan.

      **Approval berdasarkan level occupation:**
      - Level 2 (Manajer) → mengisi `approve_2`
      - Level 3 (Asmen) → mengisi `approve_3`
      - Level 1 (ADM/SDM) → hanya via Web

      **Nilai approve:** `NULL` = belum diproses, `1` = disetujui, `0` = ditolak
  - name: RFC
    description: Request For Change — endpoint baru dalam pengembangan

paths:

  # ─────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────
  /mobile-v2/login:
    post:
      tags: [Auth]
      summary: Login Pegawai
      description: |
        Login pegawai dan mendapatkan JWT token.
        - **Password**: Diverifikasi menggunakan bcrypt hash (cost 10).
        - **Device Lock**:
          - Jika `device_token` pegawai di database masih `NULL`, maka `device_token` baru akan diupdate dan pegawai boleh login.
          - Jika `device_token` tidak sama dengan perangkat terdaftar, sistem menolak login dengan pesan: *"Anda terdeteksi login menggunakan perangkat lain"*.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: '0720251286'
                password:
                  type: string
                  example: 'password123'
                device_token:
                  type: string
                  nullable: true
                  example: 'fcm_token_device_abc123...'
                device_id:
                  type: string
                  nullable: true
                  example: 'android_device_id_uuid'
                version:
                  type: string
                  nullable: true
                  example: '2.1.0'
          multipart/form-data:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: '0720251286'
                password:
                  type: string
                  example: 'password123'
                device_token:
                  type: string
                  nullable: true
                  example: 'fcm_token_device_abc123...'
                device_id:
                  type: string
                  nullable: true
                  example: 'android_device_id_uuid'
                version:
                  type: string
                  nullable: true
                  example: '2.1.0'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Gagal login (Username/password salah, akun terkunci, atau terdeteksi perangkat lain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # ABSEN HARIAN
  # ─────────────────────────────────────────
  /mobile-v2/developer-on/absen-check:
    post:
      tags: [Absensi - Absen]
      summary: Cek Absen Pegawai
      description: |
        Validasi sebelum submit absen masuk/pulang harian.

        **type:** 1 = Masuk, 0 = Pulang

        **location:** 1 = Dalam Kantor, 0 = Luar Kantor

        **Optional:** version (versi app), developer (developer mode)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, location, latitude, longitude]
              properties:
                type:
                  type: integer
                  enum: [0, 1]
                  example: 1
                location:
                  type: integer
                  enum: [0, 1]
                  example: 1
                latitude:
                  type: string
                  example: '-6.2296564'
                longitude:
                  type: string
                  example: '107.0016458'
                version:
                  type: string
                  description: Versi aplikasi (opsional)
                developer:
                  type: string
                  description: Status developer mode (opsional)
                  example: active
      responses:
        '200':
          description: Validasi berhasil
          content:
