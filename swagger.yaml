openapi: 3.0.3
info:
  title: KEPEGAWAIAN API PATRIOT
  description: |
    KEPEGAWAIAN PATRIOT API

    **Absensi** — Upload Absen (Lembur/Masuk/Pulang), Riwayat Absen, Pengajuan Izin/Cuti, Verifikasi Absen

    **Personalia** — Info Gaji, Info Data Diri, Info Perusahaan, Saran Pegawai
  version: 1.0.0

servers:
  - url: https://kepegawaian-api.aurora.tirtapatriot.com/public
    description: Production Server

security:
  - TokenAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Berhasil

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Gagal

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        must_change_password:
          type: boolean
          example: false
        user:
          type: object
          description: Data profile pegawai yang berhasil login

    AbsenCheckResponse:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        nup:
          type: string
          example: '0720251286'
        office:
          type: string
          example: Kantor Pusat
        department:
          type: string
          example: IT
        position:
          type: string
          example: Staff
        is_late:
          type: string
          example: '0'

    PreCheckLemburResponse:
      type: object
      properties:
        boleh_lembur:
          type: boolean
          example: true
        message:
          type: string
          example: Pegawai sudah absen pulang, dapat melakukan lembur

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 42
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        from:
          type: integer
          example: 1
        to:
          type: integer
          example: 10

    PengajuanItem:
      type: object
      properties:
        id:
          type: integer
          example: 1065
        pgw_id:
          type: integer
          example: 12
        nup:
          type: string
          example: '0720251286'
        nama:
          type: string
          example: John Doe
        dept_id:
          type: integer
          example: 3
        subdept_id:
          type: integer
          example: 7
        occ_id:
          type: integer
          example: 5
        level:
          type: integer
          example: 3
          description: "Level occupation pegawai (2=Manajer, 3=Asmen)"
        alasan:
          type: string
          example: Izin Sakit
        alasan_id:
          type: integer
          example: 2
        alasan_ket:
          type: string
          example: Keterangan alasan
        alasan_kode:
          type: string
          example: ISK
        keterangan:
          type: string
          example: Demam tinggi
        tanggal_pengajuan:
          type: string
          format: date
          example: '2026-05-01'
        tanggal_awal:
          type: string
          format: date
          example: '2026-05-02'
        tanggal_akhir:
          type: string
          format: date
          example: '2026-05-03'
        lampiran:
          type: string
          nullable: true
          example: 'https://kepegawaian-api.aurora.tirtapatriot.com/public/img_pengajuan/surat.pdf'
        approve_1:
          type: integer
          nullable: true
          example: 1
          description: "NULL = belum diproses, 1 = disetujui, 0 = ditolak"
        approve_2:
          type: integer
          nullable: true
          example: null
          description: "NULL = belum diproses, 1 = disetujui, 0 = ditolak"
        approve_3:
          type: integer
          nullable: true
          example: null
          description: "NULL = belum diproses, 1 = disetujui, 0 = ditolak"
        approve_1_dt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-01 09:00:00'
        approve_2_dt:
          type: string
          format: date-time
          nullable: true
          example: null
        approve_3_dt:
          type: string
          format: date-time
          nullable: true
          example: null
        approve_1_user:
          type: string
          nullable: true
          example: Admin SDM
        approve_2_user:
          type: string
          nullable: true
          example: null
        approve_3_user:
          type: string
          nullable: true
          example: null
        catatan_1:
          type: string
          nullable: true
          example: null
          description: Catatan penolakan dari level 1 (ADM/SDM)
        catatan_2:
          type: string
          nullable: true
          example: null
          description: Catatan penolakan dari level 2 (Manajer)
        catatan_3:
          type: string
          nullable: true
          example: Ga valid
          description: Catatan penolakan dari level 3 (Asmen)
        create_dt:
          type: string
          format: date-time
          example: '2026-05-01 08:00:00'
        update_dt:
          type: string
          format: date-time
          example: '2026-05-01 09:00:00'

    # ─────────────────────────────────────────
    # SCHEMAS: ALOKASI JADWAL LEMBUR
    # ─────────────────────────────────────────
